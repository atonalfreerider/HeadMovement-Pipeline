[project]
name = "atlas_bridge"
version = "0.1.0"
description = "Phone dance video -> World Labs Atlas virtual cameras -> MAMMA SMPL-X -> head-movement"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml"]

[project.scripts]
atlas-bridge = "atlas_bridge.cli:main"

[tool.setuptools]
packages = ["atlas_bridge", "atlas_bridge.atlas"]
