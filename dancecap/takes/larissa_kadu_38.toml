# Larissa & Kadu demo, the full all-camera span: same recordings, dancers and metadata as larissa_kadu.toml, but on the
# studio-derived phone clocks (alignment_studio.json: every phone's AUDIO within about +-1-2 ms of cam06's audio, in the
# onset-envelope sense; over 30-68.5 s alignment.json's phone-to-phone clocks are off by -36..+29 ms, cam07 worst, and
# 01/05/07 drift 10-13 ms/min; checked by python -m dancecap.clock_studio validate -> review/clock_studio_validation.png).
# These are AUDIO clocks: they do NOT fix video-frame sync. Phone A/V latency + sound travel leave per-phone VIDEO
# offsets of tens of ms (predicted from larissa_kadu's sync.py: about -45..+92 ms, cam04 worst), so sync.py must run on
# THIS take before MAMMA ([sync] required below; never copy another take's sync/offsets.json).
# 9 phone recordings around a studio floor (08 duplicates 09 with overlays).
name = "larissa_kadu_38"
source_dir = "../../dances/Larissa-Kadu-demo"
alignment = "../../prototype/larissa_kadu/alignment_studio.json"   # affine audio clocks, reference = 06-Demo-John.mp4
exclude = ["08"]

# reference seconds analysed in detail: the largest span inside [30.0, 68.5] where all 8 used cameras have video
# frames on the studio clocks (exact 30.0071 (cam07 first frame) .. 68.4468 (cam04 last frame)), rounded inward to
# 1/30 s: 901/30 .. 2053/30 = 38.4 s. (python -m dancecap.clock_studio window --alignment
# ../prototype/larissa_kadu/alignment_studio.json --exclude 08 --within 30 68.5)
# Ingest decodes only frames inside this window, so mamma prepare's grid is shorter: 30.0636 (cam09's first decoded
# frame) .. 68.3969 s, ~1151 frames, not 1153, before sync (clock_studio window --take -> window.json "decoded").
window = [30.033333333333335, 68.43333333333334]

# sparse snapshots of the static room, spread across the overlap so handheld cameras contribute many viewpoints.
# Same span/step as larissa_kadu; its keyframes are REUSED (copied with t re-mapped through the new clocks:
# python -m dancecap.clock_studio reuse-keyframes --from larissa_kadu --to larissa_kadu_38), so run
# 'ingest larissa_kadu_38 --window-only' (a full ingest would re-pick them and drop cam07's 30.0 s keyframe, which
# starts 7 ms before cam07's first frame on the studio clock) and 'detect larissa_kadu_38 --no-keyframes' (plain detect
# re-detects the keyframes and overwrites the copied people_masks_kf).
keyframe_span = [30.0, 68.0]
keyframe_step = 4.0

# Video sync (dancecap.sync): required = true makes 'mamma prepare' refuse to build fit inputs / a pod job until
# work/larissa_kadu_38/sync/offsets.json exists AND records these clocks (a file measured on other clocks is refused).
# Order: mamma prepare (runs ma_2d, then stops) -> python -m dancecap sync larissa_kadu_38 -> python -m
# dancecap.clock_studio window --take larissa_kadu_38 (edge margins are small: cam07 starts 26 ms before the window,
# cam04 ends 13.5 ms after it, on the audio clocks; trim the window if the sync-corrected times say so) -> mamma prepare.
[sync]
required = true

[cameras]
# Metric scale (scale stage, 2026-10-06): the cameras stage bootstraps the world with the chain rule, then INHERITS the
# scale of larissa_kadu's world corrected by its MAMMA betas (rest heights vs stature + shoe sole: x 0.95446), through
# the SfM similarity of the same physical camera frames, when the geometry gates pass (>= 4 cameras, centre residual
# < 1 % of the spread, gravity within 1 deg). The chain (CHAIN_FRAC calibrated on those same betas) is the cross-check:
# G2a world_scale fails if it is > 2 % off (coarse: triangulated before sync). Rebuild the file if shoe_sole_m or a
# stature changes (set them in BOTH tomls; the cameras stage refuses a reference built with other soles / statures, or
# one whose larissa_kadu SfM model / camera tracks / frame pts changed since - sha1 in the file):
#   python -m dancecap.cameras.world_scale reference larissa_kadu --sole <m> --out <this file>
# The result is SELF-CONSISTENT, not absolutely verified (+-1.5 %): it rests on the statures being barefoot heights.
scale_reference = { take = "larissa_kadu", sim3 = "work/larissa_kadu_38/scale/reference_larissa_kadu_world_corrected.json" }
# Static map (front stage, 2026-10-06): NOT re-mapped. larissa_kadu's bundle-adjusted COLMAP model (10 keyframes per
# camera across 30-68 s + its window frames, 0.85 px) is copied with image names re-mapped to this take's frames
# (python -m dancecap.cameras.reuse map larissa_kadu_38 --from larissa_kadu; cameras/sfm_work/map_images.json), so
# the SfM frame is identical to larissa_kadu's. Its window images cover only 56-62 s, so localisation references are
# the nearest map images in time of either kind (keyframes every 4 s): kf_by_time (cameras/localize.py LocSettings).
loc = { kf_by_time = true }

# Dance metadata (user 2026-10-06): data is siloed by level; the title is the reaction "Leader + Follower x Song".
[dance]
level = "professional"          # professional | intermediate | novice
category = "demo"               # demo | lesson | jack_and_jill
song = "Ficar Sem Você (feat. Urias)"
artist = "Davi Sabbag"
song_file = "../../dances/Larissa-Kadu-demo/Ficar Sem Você.mp3"   # studio track supplied by the user (not for any repo)

# Dancer facts supplied by the user (2026-10-05). Stature = standing height to the crown, barefoot-equivalent
# unknown (they dance in sneakers, ~2-3 cm sole). Used for metric scale (cameras) and SMPL-X shape checks.
# Body masses not supplied: physics estimates them from SMPL-X volume and flags +-10%.
# shoe_sole_m: added to the stature for the fitted mesh's crown-to-sole height (world_scale check, physics) and to the
# ankle height (floor). 0.025 ASSUMES 5'8" / 5'5" are BAREFOOT heights and the mesh sole sits on the sneaker sole -
# UNCONFIRMED (question to the user, 2026-10-06). If the heights were measured in these sneakers, set 0.0 (world
# -1.5 %) and rebuild the scale reference (see [cameras]). Whole-inch, probably self-reported: +-0.7 % more.
[dancers.lead]
name = "Kadu"
pid = 1
stature_m = 1.727   # 5'8"
description = "black t-shirt, jeans, shaved head"
shoe_sole_m = 0.025   # sneakers; UNCONFIRMED barefoot statures (see above)

[dancers.follow]
name = "Larissa"
pid = 2
stature_m = 1.651   # 5'5"
description = "long red hair, white crop top, light ripped jeans, white sneakers"
shoe_sole_m = 0.025   # sneakers; UNCONFIRMED barefoot statures (see above)
# Sneaker sole stack from the video (python -m dancecap.shoe_size, 2026-10-07; review/demo/shoe_size_*.jpg): her
# white platform sneakers' toe box, in larissa_kadu's world, is 5.6 / 3.6 cm high at 85 / 92 % of the length over
# larissa_kadu_38 (14 hi-res side views, x 1/0.95446) and 6.5 / 5.2 cm over larissa_kadu's 6 s (12 views); the
# court_platform style's 4.0 / 3.5 cm stack gave 6.5 / 6.3 cm in 02_LarissaKadu -> stack lowered 1 cm to 2.9 / 2.4 cm
# in this take's metric world (larissa_kadu's x 0.95446);
# head-movement SneakerShape also tapers the toe box (1.2 cm over the sole at the
# tip, was 1.8). Outer length / width already match the video (27.6-28.1 cm long, 10.7-11.7 cm wide in
# larissa_kadu's world; 02's sneaker 28.0 x 11.3), so the feet were not shrunk then (superseded below: narrower, lower feet).
shoe_geometry = { sole_heel_m = 0.029, sole_fore_m = 0.024 }

# Rest-shape edits of the exported Unity skins (dancecap.shape_edits, applied by every `export` / `demo_export`; the
# fitted betas, motion and joints are untouched). Midsection (lower ribs .. hips, width and depth, cosine falloff into
# chest and hips): user 2026-10-07 first asked for 25 % thinner, then "larissa's waist was reduced too much" -> 12.5 %
# thinner relative to HER OWN fitted body in this take (no cross-take reference).
# Sneakers smaller (user 2026-10-07: "visibly smaller, plausible for each dancer's stature: foot ~ 15 % of height, shoe ~
# foot + 1-2 cm"): the fitted feet are already at or under 15 % of stature (04_LarissaKaduDemo: follow 23.3 cm = 14.1 %,
# lead 25.3 cm = 14.6 %), so their LENGTH stays; the bulk goes: the feet are made narrower and lower (foot_scale
# [length, width, height]: the SMPL-X foot is wide and tall for a sneaker last) and head-movement's SneakerShape margins
# are cut (toe 11 -> 7 mm, heel 6 -> 4 mm, platform extra 3 -> 1 mm, sides 4 -> 3 mm, sole flare ~1 mm less), so the
# sneaker is the foot + ~1.2 cm long instead of + 2.0 cm and ~1.5 cm narrower.
[dancers.follow.shape_edits]
midsection_scale = 0.875
foot_scale = [1.0, 0.9, 0.92]

# Face shape (user 2026-10-08: "adjust larissa's avatar so that her face is more petite ... the avatar has an
# inflated jaw", then "we need to correct her face shape. this is a priority"; dancecap.shape_edits face block; review:
# work/larissa_kadu_38/review/face_shape_v4/face_final.jpg). Cause: the MAMMA locked-head SMPL-X keeps the template face,
# only scaled with the head: a long, square lower face (nasion-menton +1.5 SD in the FLAME 2020 female shape space), a
# long chin and a full under-chin. WHY this block: the template face is replaced by an IDENTITY FIT + a petite taper:
#   identity = a FLAME identity fitted (SMIRK) to her portrait + video frames (portrait-weighted), transplanted onto the
#     SMPL-X head (dancecap.face_identity); file work/larissa_kadu_38/face_shape/follow_identity_portrait.npz, the per-take
#     displacement is cached in work/<take>/face_shape/follow_identity_disp.npz; identity_mouth 0.4 = the lips take 40 % of
#     its move;
#   jaw_taper / cheekbone_keep / chin_point = a V from the full cheeks to a small, softly pointed chin;
#   chin_forward_mm = the chin proper brought 4 mm forward (the identity sets it ~8 mm behind the nasion line);
#   neck_under_jaw = a slimmer under-jaw (no ledge at the neck).
# This fit (04): nasion-menton 111.4 -> 101.1 mm, jaw angles 106.2 -> 93.1, chin 59.9 -> 48.6, cheeks 131.9 unchanged (take 02: 118.3 -> 106.9, 112.3 -> 98.6, 63.9 -> 51.7).
# Eyes, brows, nose, forehead, cranium, scalp (hair roots), ears and the neck-shoulder seam are unchanged. Replaces the first
# 'target' scales (lower_face_height_scale 0.94 ..., far too weak, never visible). If it reads too pointed in Unity: chin_point
# 0.35 -> 0.25 and jaw_taper 0.92 -> 0.93 (keep cheekbone_keep >= 0.5); if the lips read squeezed: identity_mouth -> 0.3.
[dancers.follow.shape_edits.face]
identity = "work/larissa_kadu_38/face_shape/follow_identity_portrait.npz"
identity_weight = 1.0
identity_mouth = 0.4
jaw_taper = 0.92
cheekbone_keep = 0.75
chin_point = 0.35
neck_under_jaw = 0.94
chin_forward_mm = 4.0

[dancers.lead.shape_edits]
foot_scale = [1.0, 0.94, 0.95]

# Motion exported to Unity (EVERY exporter: `python -m dancecap export` and `python -m dancecap.demo_export` read this via
# export_unity.resolve_smplx_dir; --smplx-dir smplx exports the raw fit). The MAMMA fit in smplx/ stays the evidence
# (timing and physics run on it). The avatars play work/larissa_kadu_38/smplx_rf2_noslip/ = `python -m
# dancecap.pose_refine larissa_kadu_38 --dst smplx_rf2_noslip --device cuda` (current defaults, run on a pod): 5 Hz root /
# 8 Hz rotation zero-phase low-pass + an image-aware refinement of the root HEIGHT and the hip / knee / ankle rotations
# that puts the planted soles on the floor (MAMMA has no floor term), with each foot's own 2D term and the ankles / feet
# anchored horizontally. Chosen ('post' review fix, 2026-10-07) from 8 variants (quality/variants.json,
# review/pose_refine_variants.png); numbers lead / follow vs smplx/:
#   floats > 15 mm 22 / 29 % -> 0.6 / 1.5 % of frames, sinks 13 / 9 % -> 0;
#   stance ankles moved 2.5 / 2.8 mm sideways (median; p95 6.5 / 7.2) and 7 / 8 mm vertically;
#   reprojection, all 512 points: 5.71 / 7.32 -> 6.05 / 7.42 px; per camera lead 02 +0.62, 03 +0.74, 04 +0.45, 09 +0.87,
#   01 0.0, 05 +0.09, 06 -0.28, 07 -0.36; follow 02 +0.58, 03 +0.77, 04 +0.50, 09 +1.29, 01 -0.30, 05 -0.26, 06 -0.53,
#   07 -0.39 (the cameras disagree about foot height; every floor-fixing variant splits them this way);
#   feet only (88 points): 7.57 / 8.56 -> 7.43 / 8.37 px (IN-SAMPLE: the refinement fits the same landmarks);
#   foot slip on the raw fit's stance frames (contact-point speed) 99 / 127 -> 93 / 119 mm/s (filter alone 93 / 113);
#   4.5-12 Hz root jitter 1.95 / 3.37 -> 0.58 / 0.98 mm: the 5 Hz low-pass removes that band BY CONSTRUCTION.
# The first refinement (smplx_refined, kept for comparison) pinned every stance frame against slip and moved the stance
# ankles 27-35 mm sideways, feet-only reprojection 9.0 / 9.6 px. Remove this section to export the raw fit.
[export]
smplx_dir = "smplx_rf2_noslip"
# Viewer floor (user 2026-10-08: "rotate the floor only, by 30 deg CCW so that it lines up with the room in the videos"): the 1 m
# grid crosses + plane are turned 30 degrees counter-clockwise as seen from above, about the vertical axis through the dance origin
# (capture.json floor_yaw_deg; the dancers, cameras and floor-craft overlays stay). larissa_kadu_38 and larissa_kadu_full share one SfM
# world frame ([reuse] world), so one value serves 04_LarissaKaduDemo and 05_LarissaKaduFull.
floor_yaw_deg = 30.0

[world]
dance = "larissa_kadu_full"
id = "612dfea3d607"
pose_id = "02974c41d6db"
role = "reference"
