category = "jack_and_jill"      # demo | lesson | jack_and_jill
song_file = "../../../../Videos/Zouk/lucas-luisa-jnj/Brenda Mullen - I Don't Wanna Know (Mario Winans Cover).mp3"   # studio track (stays local, never in a repo)

[dancers.lead]
