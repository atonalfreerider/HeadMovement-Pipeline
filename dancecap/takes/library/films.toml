# The Jack & Jill heat of Carlos and Aline (capture 07_CarlosAline): a film without narration. [carlos_aline.heat] makes `film_library build
# --carlos-aline` write its auto-direction first (dancecap/film_heat.py: film time = dance time, the capture's own soundtrack is the mix, a slow
# orbit in front of the room's wall, an overhead floor-craft view every ~28 s, the zouk beat counter while a song plays). Its chapters are the song
# structure (song/segments.json timeline, one per state: the titles below are keyed by state). Camera keys of film_heat.DEFAULTS may be set here.
[carlos_aline]
id = "carlos_aline"
title = "Carlos + Aline"
subtitle = "Jack & Jill heat, Zouk SEA 2019: the whole dance in 3D, with the two songs of the heat"
capture = "07_CarlosAline"
direction = "dancecap/work/carlos_aline/film/direction.json"
thumbnail = "dancecap/work/carlos_aline/film/review/card_thumb.jpg"   # a clean 3D frame of the two avatars in the room, no text
slowmo_audio = "pitch"   # the music of the heat slows with the picture (set "mute" to silence it in slow motion)

[carlos_aline.heat]
name = "carlos_aline"
take = "carlos_aline"
songs = "dancecap/work/carlos_aline/song/segments.json"
# The looks (owner 2026-10-11: "no room and avatars should be at 75% transparent", "there should be a live score along the way"):
#   avatar_opacity = 0.25 reads "75 % transparent" literally (opacity 0.25: the dancers are faint and the skeleton lines read through them);
#   the other reading, "75 % opaque", is avatar_opacity = 0.75 (rebuild with `python -m dancecap.film_library build --carlos-aline`, or edit the one
#   "avatar_opacity" number at the top of work/carlos_aline/film/direction.json).
avatar_opacity = 0.25
room = false                # no room mesh: the dancers float over the dark floor grid
skeleton_lines = 1.0        # the skeleton strokes at normal strength
rhythm_score = true         # the live rhythm score HUD and the final score card (work/carlos_aline/rhythm/rhythm.json -> the capture's rhythm layer)

[carlos_aline.heat.titles]
entrance = "Entrance and announcement"
kojo = "First song: Kojo Funds"
mix = "DJ mix"
guetta = "Second song: David Guetta"
end = "Bow and applause"


# The Jack & Jill heat of John and Lula (capture 08_JohnLula): ONE phone, ONE song (unknown, 75 BPM), a film without narration like the Carlos + Aline one
# (film_heat.py). The chapters are the song structure of song/segments.json (intro without a beat, the music, the applause) with the music cut into its
# three 8-bar phrases (24 whole bars, 3.2 s each: `split`); the looks are the Carlos + Aline heat's (no room, avatars at 75 % transparency, skeleton
# lines, the live rhythm score). The camera keeps both dancers framed and close (the couple about 50 to 60 percent of the frame height; the overhead views closer).
[john_lula]
id = "john_lula"
title = "John + Lula"
subtitle = "Jack & Jill heat: the whole dance in 3D from one phone, with its beat grid and rhythm score"
capture = "08_JohnLula"
direction = "dancecap/work/john_lula/film/direction.json"
thumbnail = "dancecap/work/john_lula/film/review/card_thumb.jpg"   # a clean 3D frame of the two avatars, no text
slowmo_audio = "pitch"   # the music of the heat slows with the picture (set "mute" to silence it in slow motion)

[john_lula.heat]
name = "john_lula"
take = "john_lula"
songs = "dancecap/work/john_lula/song/segments.json"
avatar_opacity = 0.25       # "75 % transparent" read literally (opacity 0.25), as for the other heat; the one number to edit for the other reading (0.75)
room = false                # the film does not show the room (J2's hall model is weak: wall offsets +-2.5 m)
skeleton_lines = 1.0
rhythm_score = true
radius_m = 3.0              # a little wider than the default 2.7 m: the couple about 50 to 60 percent of the frame height (portrait), both always inside the frame
radius_vertical_m = 2.4
overhead_fill = 0.85
no_overhead_after_s = 80.0  # no overhead view in the applause

[john_lula.heat.split]
music = { every_s = 25.6 }  # 24 bars of 3.2 s = three 8-bar phrases

[john_lula.heat.titles]
intro = "Intro, no beat yet"
music_1 = "Dance, first phrase (bars 1-8)"
music_2 = "Dance, second phrase (bars 9-16)"
music_3 = "Dance, third phrase (bars 17-24)"
outro = "Applause"


# The Jack & Jill heat of Lucas and Luiza (capture 09_LucasLuiza, Zouk Heat 2024): TWO cameras - a tripod (the take's camera 01, the monocular
# fit's) and a Steadicam (camera 02, attached to the fit through the dancers: cameras.attach_moving) - and TWO songs (the owner's studio track,
# then "Nao Me Toca"). Owner 2026-10-23: "play it back in rhythm mode", "smoothly orbiting the camera and moving in and out of the POVs of the
# two videos". The looks are the other heats' (avatars 75 % transparent, skeleton lines, the live rhythm score), the orbits 20 % closer than the
# heat default (the v4.2 splat-mode rule: 2.7 -> 2.16 m), and every ~26 s the orbit flies into one camera's point of view and back out
# (film_heat pov_*): the tripod's video under the 3D dancers; the Steadicam's video OVER them while it holds (its pose registers the 3D
# dancers only approximately: 5.5 % of their height, median). POV windows: pov_table.json (pose ok, both dancers in the picture, Jev's view).
# 2026-10-25: retargeted from the monocular lucas_luiza_h to the TWO-VIEW take lucas_luiza (owner: "I want the jnj performance rendered as a
# horizontal recording in rhythm mode"): both cameras are in the fit, so both videos sit UNDER the 3D dancers. The two-view take numbers the
# cameras the other way round: 01 = the Steadicam (POV only where its room-map pose is verified, 52 % of the dance), 02 = the tripod.
[lucas_luiza]
id = "lucas_luiza"
title = "Lucas + Luiza"
subtitle = "Jack & Jill heat, Zouk Heat 2024: the whole dance in 3D from a tripod and a Steadicam, with the two songs of the heat"
capture = "09_LucasLuiza2V"     # the two-view capture (09_LucasLuiza, the monocular one, is kept as it was)
direction = "dancecap/work/lucas_luiza/film/direction.json"
thumbnail = "dancecap/work/lucas_luiza/film/review/card_thumb.jpg"
slowmo_audio = "pitch"

[lucas_luiza.heat]
name = "lucas_luiza"
take = "lucas_luiza"
songs = "dancecap/work/lucas_luiza/song/segments.json"
avatar_opacity = 0.25
room = false                # no room splat model of this ballroom (the SfM map is sparse): the dark floor grid
skeleton_lines = 1.0
rhythm_score = true         # work/lucas_luiza/rhythm/rhythm.json -> the capture's rhythm layer
radius_m = 2.16             # 0.8 x the heat default 2.7 (v4.2: "in gauss splat mode let's get 20% closer to the dancers when we orbit")
radius_vertical_m = 1.72
no_overhead_after_s = 204.0      # the two-view clock = lucas_luiza_h's + 14.0 s (the closing applause)
pov_cameras = ["01", "02"]
pov_table = "dancecap/work/lucas_luiza/film/pov_table.json"   # film_heat pov-table --take lucas_luiza --cams 01,02 --margin 0
pov_s = 8.0
pov_min_ok = 0.75           # 2026-10-25: the two-view take's cameras are showable 31 % (Steadicam: pose-verified frames) / 66 % (tripod)
pov_every_s = 22.0          # the owner's "moving in and out of the POVs of the two videos": more POV shots than the heat default (26 s) ...
cycle_s = 42.0              # ... and fewer overheads (heat default every 28 s): a POV is never placed next to an overhead
pov_composite = { "01" = "3d_over_video", "02" = "3d_over_video" }

[lucas_luiza.heat.titles]
intro = "Entrance"
song1 = "First song: I Don't Wanna Know (Brenda Mullen)"
song2 = "Second song: Não Me Toca (Anselmo Ralph)"
outro = "Final pose and bow"

