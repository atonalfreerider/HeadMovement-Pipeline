# The films the Unity viewer's library offers (python -m dancecap.film_library build --demo | --recap).
# Per-film presets for dancecap/film_library.py; paths are relative to the workspace. Titles and subtitles may name the dancers: the
# library file they end up in (head-movement/Assets/StreamingAssets/library/library.json) is git-ignored data.
# [<preset>.chapters] anchor each chapter at the direction segment where it starts, so the marks survive a rebuild of the film.

[demo]
id = "demo"
title = "Kadu + Larissa × Ficar Sem Você"
subtitle = "The counterbalance demo, rebuilt in 3D from the class's phone videos"
capture = "05_LarissaKaduFull"
direction = "dancecap/work/larissa_kadu_full/film/direction.json"
thumbnail = "head-movement/Recordings/05_LarissaKaduFull_thumbnail_vertical.jpg"

[[demo.chapters]]
title = "Intro"
segment = "open_title"

[[demo.chapters]]
title = "Filmed by the class"
segment = "cameras_overview"

[[demo.chapters]]
title = "The exit step"
segment = "lp1_approach"

[[demo.chapters]]
title = "Floor craft"
segment = "floorcraft"

[[demo.chapters]]
title = "The counterbalance"
segment = "cb2_setup"

[[demo.chapters]]
title = "The step around her"
segment = "lp2_feet_in"

[[demo.chapters]]
title = "A path through the moves"
segment = "graph_in"

[[demo.chapters]]
title = "Physics view"
segment = "physics_in"

[[demo.chapters]]
title = "The exit again"
segment = "lp3_feet_in"

[[demo.chapters]]
title = "Head movement"
segment = "head_movement"

[[demo.chapters]]
title = "The last counterbalance"
segment = "orbit_mid"

[[demo.chapters]]
title = "Rhythm and thanks"
segment = "rhythm"

# The class recap: a card in the library from the start ("Processing" and not playable) until its capture folder and its film exist.
# Its chapters come from the direction itself (segments with a "chapter" field) or from a plan added here once the film is directed.
[recap]
id = "recap"
title = "Class recap"
subtitle = "The whole lesson by Larissa and Kadu, in 3D"
capture = "06_LarissaKaduRecap"
direction = "dancecap/work/larissa_kadu_recap/film/direction.json"
thumbnail = "dancecap/work/larissa_kadu_recap/film/review/recap_card_thumb.jpg"   # a clean 3D frame of the two avatars (T3), no text

