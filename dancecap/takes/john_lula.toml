# John & Lula, JACK & JILL heat (owner 2026-10-11: "let's run John (5'11 black shirt) and Lula (5'7) through the pipeline also for jack and
# jill. restyle lula's hair for her ponytail. do the rhythm analysis"). Take name john_lula, work dir work/john_lula/ (git-ignored), notes
# work/john_lula/NOTES_J1.md. The source folder dances/John-Lula (a git-ignored junction to a folder in the owner's Zouk videos directory that holds
# hard links to ONLY the two files of this job) is the owner's; the video and the photo are likeness data of real people: used locally and on the
# owner's Runpod volume only, never copied into a repo.
#
# ONE CAMERA. john_lula_jnj.mp4 is a single handheld phone video, 538x960 portrait, 29.994 fps (14997/500), 88.118 s, h264 + AAC 44.1 kHz stereo:
# the only source, so it IS the reference clock (identity clock, work/john_lula/clock/alignment.json written by dancecap.pipeline.audio_sync's
# single-view identity; the pipeline's "single" variant). There is nothing to sync against: no [sync] table (dancecap.sync is multi-view geometry,
# mamma_dyn.read_sync_offsets returns {} when work/john_lula/sync/offsets.json is absent = a zero offset, and a missing [sync] required means that
# is allowed). The whole window is monocular: [stitch] mono below.
#
# A multi-couple floor, not a stage: 3-5 other couples dance on the same floor at the same time, judges / spectators stand round the edge of the
# floor (clipboards, phones). The couple is identified by the competition bibs on their backs: John 124 (black t-shirt), Lula 116 (grey trousers).
# The clip is cut mid-dance at both ends (the couple is already dancing in frame 0 and still dancing in the last frame).
name = "john_lula"
source_dir = "../../dances/John-Lula"
alignment = "../work/john_lula/clock/alignment.json"   # identity clock of the single view (pipeline.audio_sync.identity)
exclude = []

# Danced span = the whole video: first frame 0.0 s, last frame 88.084 s (30 Hz lattice anchored on t = 0: k = 0..2642, t = 0..88.067 s, T = 2643).
window = [0.0, 88.08]

# Sparse snapshots of the static room (the room is a convention hall; J2 calibrates room and camera). The camera is handheld, walks about and zooms
# (3 steps), so a keyframe every 2 s (44 frames) gives the SfM map many viewpoints.
keyframe_span = [0.0, 88.0]
keyframe_step = 2.0

[timeline]
anchor = 0.0
hz = 30.0

[ingest]
max_fps = 30        # the video is 29.994 fps: read whole

# Farm chunking (owner 2026-10-09: chunks of at most 60 s overlapping their neighbours by 4 s, the fewest equal windows). Arithmetic
# (farm/chunks.py equal_windows(2643 frames, 30 Hz, 60 s, 4 s)): one window would be 88.1 s > 60 s; n = 2 windows of L = (2643 + 1 x 120) / 2 =
# 1381.5 frames = 46.05 s each (1382 and 1381 frames: windows k 0..1381 and 1262..2642, overlap 120 frames = 4.0 s), cores cut at the middle of the
# overlap: 0..1321 (44.07 s) and 1322..2642 (44.03 s). Planner profile "john_lula" (farm/jl_profile.py, single-camera ma_3d), see below.
[chunks]
chunk_s = 60.0
overlap_s = 4.0
mode = "windows"
profile = "john_lula"   # J3b: farm/jl_profile.py (one moving camera, single-camera ma_3d)

# Quality flags (dancecap.stitch): ONE camera, so the whole window is monocular.
[stitch]
mono = [[0.0, 88.08]]

[dance]
level = "professional"          # professional | intermediate | novice
category = "jack_and_jill"      # demo | lesson | jack_and_jill
# SONG: UNKNOWN. There is no studio file and no on-screen text; the heat's own audio is the only sound. dancecap.song (needs [dance] song_file) cannot
# run on this take; dancecap.heat_beats builds the beat grid from the heat's audio: 75.00 BPM (pulse 0.8000 s, bar 3.200 s), constant tempo, music
# from 3.4 s to 80.2 s on the video clock (work/john_lula/NOTES_J1.md). The grid file is the role of beats_studio.json:
song = "unknown"
artist = "unknown"
song_source = "heat audio only (no studio file)"
beats = "work/john_lula/song/beats_heat.json"
venue = "unknown (a convention hall; competition bibs 124 / 116)"

# John = lead, Lula = follow (the video: he frames and leads the figures, she spins and follows; John listed first by the owner). Clothes and hair as
# filmed (frames at 0.5, 20, 45, 85 s) and in the photo GM6B6189.jpg of the same two people. Statures from the owner (5'11" = 1.803 m, 5'7" = 1.702 m).
# Heads-up for identity selection: other couples on the floor wear black / white / red; the dancers are told apart by the bibs (John 124 on the back
# of the t-shirt, Lula 116 on the back of her trousers).
[dancers.lead]
name = "John"
pid = 1
stature_m = 1.803   # 5'11"
description = "short brown hair swept to one side, short full brown beard, black crew-neck t-shirt, black trousers, dark charcoal sneakers"
# AVATAR APPEARANCE (agent J5a, 2026-10-11, from the photo and the video stills; the owner flips any line): short brown hair and a short full brown beard are
#   TEXTURE (no groom for the lead: the photo composite carries the beard, as for the other leads), plain black t-shirt (the bib is a texture detail the bake
#   will not keep), black trousers, dark sneakers. The competition bib, a black wristwatch: not modelled. Palette / colours measured: work/john_lula/avatar/.
shoe_sole_m = 0.025   # dark soft sneakers; UNCONFIRMED barefoot stature (as in the demo)
portrait = "GM6B6189.jpg"   # J5a: the photo of the two (source_dir): the lead faces the camera in it (beard, smile); the follow is seen from behind
shoe_style = "neutral"      # low-top lace-up sneakers, dark charcoal upper, light-grey chunky cupsole (work/john_lula/avatar/shoes_override.json carries the colours)
shoe_geometry = { sole_heel_m = 0.032, sole_fore_m = 0.024, toe_spring_m = 0.009, heel_bevel_m = 0.005 }

[dancers.follow]
name = "Lula"
pid = 2
stature_m = 1.702   # 5'7"
description = "long auburn ponytail tied high on the crown, sheer long-sleeve cropped top with a brown printed pattern over a coral sports top, loose grey trousers, pale pink slip-on sneakers"
# AVATAR APPEARANCE (agent J5a, 2026-10-11): hair auburn / copper brown (a measured palette in work/john_lula/avatar/hair_palette.json: the hair at the scalp
#   reads darker than the tail), worn in a HIGH PONYTAIL: `hair_style = "ponytail"` below makes dancecap.hair_groom (seed_from / restyle) build the ponytail groom
#   (dancecap.hair_ponytail; overrides in [dancers.follow.hair_ponytail], e.g. tail_frac_of_height, tie_el_deg, flare; defaults: tie on the crown 52 deg above the
#   head-sphere equator, the tail about 0.22 x stature, to the shoulder blades) with a small hair tie and a blue barrette drawn at the tie. The top is a
#   TEXTURE (a printed pattern: only its main colours survive the 538 x 960 video: brown / maroon / cream on skin tone, coral underneath), the grey trousers are
#   texture, the bib and the watch / wristband are not modelled. Tip glow stays on (the stylisation of the demo's hair); `hair_tip_glow = 0` drops it.
shoe_sole_m = 0.02   # thin light-pink slip-on sneakers; UNCONFIRMED barefoot stature (as in the demo)
shoe_style = "neutral"      # pale dusty-pink slip-on flats with a thin cream sole (colours: work/john_lula/avatar/shoes_override.json)
shoe_geometry = { sole_heel_m = 0.018, sole_fore_m = 0.014, toe_spring_m = 0.006, heel_bevel_m = 0.003 }
# HAIR (owner 2026-10-11: "restyle lula's hair for her ponytail"): a high ponytail, auburn / light brown (the photo: a blue clip on the hair tie). Read by
# dancecap.hair_groom (ponytail_hook -> dancecap.hair_ponytail, J5a 2026-10-11) and the avatar stages; the loose style is the default of every other take.
hair_style = "ponytail"
# J5b 2026-10-11 (judged in Unity on the real poses): the white tip glow of the demo's stylisation reads as white sparks on auburn hair: OFF (1.0 brings it back); the palette's albedo gain
# 1.85 renders the hair a bright orange against the photo's auburn (114/55/33): 1.45. Flip either, then `jl_avatars hair-groom` + `jl_export --avatars`.
hair_tip_glow = 0.0
hair_albedo_gain = 1.45

# Camera type (dancecap.camera_types). MEASURED by agent J1 2026-10-11 (background LK tracks with the people masked, work/john_lula/NOTES_J1.md):
# handheld (the viewpoint walks about: the room view changes across the floor; image-centre speed median 19 px/s, p90 61 px/s, max 255 px/s; roll up
# to 8 deg over a few seconds) with THREE fast zoom steps of ~0.7 s each: x1.97 at 17.84-18.57 s (zoom in), x0.51 at 51.51-52.24 s (out), x1.89 at
# 78.75-79.38 s (in): the phone's 1x / 2x switch; in between the zoom is constant (net scale within 3.3 % per 5 s, mostly under 1.3 %). Not confirmed by the owner:
# source = "auto" (the stages keep the general model handheld + zoom until it is confirmed).
[cameras."01"]
file = "john_lula_jnj.mp4"
mount = "handheld"          # handheld | tripod                 (measured)
zoom = true                 # true | false, independent of mount (measured: three 1x <-> 2x steps)
source = "auto"             # user = confirmed | auto = suggestion, not confirmed yet
set_at = "2026-10-11T03:00:00Z"
zoom_events = [[17.84, 18.57, 1.97], [51.51, 52.24, 0.51], [78.75, 79.38, 1.89]]   # [t0, t1, focal ratio], video seconds (measured)

# Face identities (J5a 2026-10-11, work/john_lula/NOTES_J5a_face.md): the lead = his portrait photo + 4 video faces (14-40 px outer-canthal), weight 1.0; the follow
# has NO portrait (seen from behind in the photo): 6 video faces of 13-33 px outer-canthal only, so her identity is shrunk to 0.65 (the measured scale of a video-only
# code against a portrait code, face-trust). Both are displacements of the lower face / jaw only. The retarget to the fitted betas runs after the pose stage.
[dancers.lead.shape_edits.face]
identity = "work/john_lula/face_shape/lead_identity.npz"
identity_weight = 1.0
identity_mouth = 0.4

[dancers.follow.shape_edits.face]
identity = "work/john_lula/face_shape/follow_identity.npz"
identity_weight = 0.65
identity_mouth = 0.4

# Unity capture (J4, 2026-10-11; python -m dancecap.jl_export): the stitched REFINED motion; the viewer's floor visuals are not turned: the world frame's X is already
# the hall's axis (J2: the far wall is parallel to X within 1 degree, work/john_lula/NOTES_J2.md).
[export]
smplx_dir = "smplx_rf2_noslip"
floor_yaw_deg = 0.0
