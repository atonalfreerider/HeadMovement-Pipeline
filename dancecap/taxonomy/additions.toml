name = "Sarrada"
aliases = ["cicada", "hip press"]
family = "hold"                     # close embrace (Hourglass)
tone = "green"
energy = 0.3
near = ["hug", "body-roll", "gostosinho"]
links_from = ["hug"]
links_to = ["hug"]
status = "accepted"
description = "Hip-led press against the partner in close embrace. The user identified the move first heard as 'cicada' as sarrada (2026-10-06); the terminology research found no zouk syllabus source, so the name rests on the user's decision."
